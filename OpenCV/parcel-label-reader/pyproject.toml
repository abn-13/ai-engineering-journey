[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "parcel-reader"
version = "0.1.0"
description = "Classic-OpenCV parcel label reader: detect the parcel, decode its label, measure it"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
